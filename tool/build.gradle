plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'kotlin-kapt'
}
android {
    namespace 'com.chinshry.tool'
}

apply from: "../common.gradle"

dependencies {
    // ARouter
    kapt 'com.alibaba:arouter-compiler:1.5.2'

    implementation project(path: ':base')
    implementation project(path: ':accessibility')
}